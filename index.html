<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vivos Byggkonsult AS | Byggesøknad, deling og seksjonering</title>

  <meta name="description"
        content="Vivos Byggkonsult AS bistår med byggesøknad, deling av eiendom og matrikkelenhet, seksjonering, prosjektering og tegning.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f5f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #414b59;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 26px;
      padding: 38px 34px 28px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    /* LOGO */

    .logo {
      display: block;
      width: 100%;
      max-width: 320px;
      height: auto;
      margin: 0 auto 28px;
    }

    /* SLAGORD */

    .tagline {
      margin: 0 auto 30px;
      font-size: 18px;
      line-height: 1.55;
      color: #3f4855;
    }

    /* TJENESTER */

    .services {
      margin: 0 auto 32px;
      padding: 4px 0;
    }

    .services img {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      margin: 0 auto;
    }

    /* KNAPPER */

    .actions {
      display: grid;
      gap: 11px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 54px;
      padding: 14px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      background: #078fc4;
      color: #ffffff;
    }

    .button-secondary {
      background: #edf7fa;
      color: #0788bd;
    }

    .icon {
      font-size: 18px;
      line-height: 1;
    }

    /* KONTAKTINFO */

    .contact {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 30px;
      padding: 20px 0;
      border-top: 1px solid #dce3e7;
      border-bottom: 1px solid #dce3e7;
    }

    .contact-item {
      flex: 1;
      padding: 0 12px;
    }

    .contact-item + .contact-item {
      border-left: 1px solid #dce3e7;
    }

    .contact a {
      color: #414b59;
      text-decoration: none;
      font-size: 14px;
    }

    .contact-symbol {
      color: #0788bd;
      margin-right: 5px;
    }

    /* FIRMAINFORMASJON */

    .company {
      margin-top: 22px;
      font-size: 12px;
      color: #7b858d;
      line-height: 1.5;
    }

    /* MOBIL */

    @media (max-width: 520px) {
      body {
        padding: 0;
        align-items: flex-start;
        background: #ffffff;
      }

      .card {
        max-width: none;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
        padding: 30px 24px 24px;
      }

      .logo {
        max-width: 300px;
        margin-bottom: 25px;
      }

      .tagline {
        font-size: 17px;
        margin-bottom: 26px;
      }

      .services {
        margin-bottom: 28px;
      }
    }

    @media (max-width: 370px) {
      .card {
        padding-left: 18px;
        padding-right: 18px;
      }

      .contact {
        flex-direction: column;
        gap: 10px;
      }

      .contact-item + .contact-item {
        border-left: 0;
      }
    }
  </style>

  <!-- Strukturert informasjon for søkemotorer -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Vivos Byggkonsult AS",
    "email": "post@vivos.no",
    "telephone": "+4792409094",
    "description": "Vivos Byggkonsult AS bistår med byggesøknad, byggesak, deling av eiendom og matrikkelenhet, seksjonering, prosjektering og tegning.",
    "areaServed": "Norge",
    "knowsAbout": [
      "Byggesak",
      "Byggesøknad",
      "Ansvarlig søker",
      "Deling av eiendom",
      "Matrikkelenhet",
      "Seksjonering",
      "Prosjektering",
      "Tegning"
    ]
  }
  </script>
</head>

<body>

  <main class="card">

    <img
      src="logo-vivos.jpg"

    <p class="tagline">
      Vi tar oss av søkerjobben<br>

      <img

    </section>

    <div class="actions">

      <a class="button button-primary"
         href="mailto:post@vivos.no">
        <span class="icon">✉</span>
        Send e-post
      </a>

      <a class="button button-secondary"
         href="tel:+4792409094">
        <span class="icon">☎</span>
        Ring oss
      </a>

      <a class="button button-secondary"
         href="vivos.vcf"
         download>
        <span class="icon">＋</span>
        Lagre kontakt
      </a>

    </div>

    <div class="contact">

      <div class="contact-item">
        <span class="contact-symbol">✉</span>
        <a href="mailto:post@vivos.no">
          post@vivos.no
        </a>
      </div>

      <div class="contact-item">
        <span class="contact-symbol">☎</span>
        <a href="tel:+4792409094">
          924 09 094
        </a>
      </div>

    </div>

    <footer class="company">
      Vivos Byggkonsult AS &nbsp;|&nbsp; Org.nr. 919 543 825
    </footer>

  </main>

</body>
</html>
