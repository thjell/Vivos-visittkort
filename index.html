  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f5f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #555;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 22px;
      padding: 42px 32px 34px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.09);
    }

    .logo {
      width: 100%;
      max-width: 330px;
      height: auto;
      margin-bottom: 30px;
    }

    .tagline {
      font-size: 18px;
      line-height: 1.5;
      color: #555;
      margin: 0 auto 28px;
      max-width: 330px;
    }

    .services {
      color: #0788bd;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1.4px;
      margin-bottom: 32px;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    .button {
      display: block;
      padding: 15px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .primary {
      background: #0788bd;
      color: white;
    }

    .secondary {
      background: #eef7fa;
      color: #0788bd;
    }

    .button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .contact {
      margin-top: 28px;
      font-size: 14px;
      line-height: 1.8;
      color: #777;
    }

    .contact a {
      color: #555;
      text-decoration: none;
    }

    .company {
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
        background: white;
      }

      .card {
        box-shadow: none;
        padding: 30px 18px;
      }
    }
  </style>

  <script type="application/ld+json">
