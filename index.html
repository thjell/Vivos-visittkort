<!DOCTYPE html>
<html lang="no">

  <meta

  <style>

    /* =========================
       GRUNNOPPSETT
       ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f3f5f6;

      font-family: Arial, Helvetica, sans-serif;
      color: #414b59;
    }


    /* =========================
       VISITTKORT
       ========================= */

    .card {
      width: 100%;
      max-width: 460px;

      background-color: #ffffff;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.58),
          rgba(255, 255, 255, 0.58)
        ),
        url("background.png");

      background-size: cover;
      background-position: 58% center;
      background-repeat: no-repeat;

      border-radius: 26px;

      padding: 38px 34px 26px;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.08);

      text-align: center;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {
      display: block;

      width: 100%;
      max-width: 320px;
      height: auto;

      margin: 0 auto 26px;
    }


    /* =========================
       SLAGORD
       ========================= */

    .tagline {
      margin: 0 auto 27px;

      font-size: 18px;
      line-height: 1.55;

      color: #3f4855;
    }


    /* =========================
       TJENESTER
       ========================= */

    .services {
      margin: 0 auto;
      padding: 0;
    }

    .services img {
      display: block;

      width: 100%;
      max-width: 350px;
      height: auto;

      margin: 0 auto;
    }


    /* =========================
       KONTAKTTEKST
       ========================= */

    .cta-text {
      margin: 24px auto;

      font-size: 16px;
      line-height: 1.5;

      color: #414b59;
    }


    /* =========================
       KNAPPER
       ========================= */

    .actions {
      display: grid;
      gap: 10px;

      width: 100%;
      max-width: 320px;

      margin: 0 auto;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      min-height: 52px;
      padding: 13px 18px;

      border-radius: 11px;

      text-decoration: none;

      font-size: 16px;
      font-weight: 700;

      color: #414b59;

      transition:
        transform 0.15s ease,
        background-color 0.15s ease,
        border-color 0.15s ease;
    }

    .button-primary {
      background: #f1f3f4;
      border: 1px solid #d9dee1;
    }

    .button-secondary {
      background: #f7f8f8;
      border: 1px solid #e3e7e9;
    }

    .button:hover {
      transform: translateY(-1px);
      background: #ffffff;
      border-color: #cbd2d6;
    }

    .button:focus-visible {
      outline: 3px solid rgba(7, 136, 189, 0.25);
      outline-offset: 2px;
    }

    /* Symbolene i knappene bruker Vivos-blå */

   .icon {
  width: 18px;
  height: 18px;
  flex: 0 0 18px;

  stroke: #0788bd;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}


    /* =========================
       FIRMAINFORMASJON
       ========================= */

    .company {
      margin-top: 24px;
      padding-top: 14px;

      border-top: 1px solid #dce3e7;

      font-size: 10px;
      line-height: 1.6;

      color: #707980;
    }

    .company .divider {
      margin: 0 6px;
      color: #b8bec2;
    }


    /* =========================
       MOBIL
       ========================= */

    @media (max-width: 520px) {

      body {
        padding: 0;
        align-items: flex-start;
        background: #ffffff;
      }

      .card {
        max-width: none;
        min-height: 100vh;

        border-radius: 0;
        box-shadow: none;

        padding: 28px 24px 22px;

        background-position: 60% center;
      }

      .logo {
        max-width: 295px;
        margin-bottom: 23px;
      }

      .tagline {
        margin-bottom: 24px;

        font-size: 17px;
        line-height: 1.5;
      }

      .services img {
        max-width: 340px;
      }

      .cta-text {
        margin: 24px auto;
        font-size: 16px;
      }

      /* Samme bredde som logo på mobil */

      .actions {
        max-width: 295px;
      }
    }


    /* =========================
       SMÅ MOBILSKJERMER
       ========================= */

    @media (max-width: 370px) {

      .card {
        padding-left: 18px;
        padding-right: 18px;
      }

      .logo,
      .actions {
        max-width: 100%;
      }

      .company .divider {
        margin: 0 3px;
      }
    }

  </style>
